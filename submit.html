<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add a Piece</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="submit-page">
  <main class="submit-container">
  <a href="index.html">Back to the archive</a>
  <h1>Add a Piece</h1>

  <form id="submit-form">
    <div>
      <label for="piece-image">Image of what you captured</label>
      <input type="file" id="piece-image" onchange="handleImageUpload()" name="image" accept="image/*" required>
      <img id="display-image" height="500" src=" " alt="user's submitted object" hidden>
    </div>

    <div>
      <label for="piece-title">Title this piece.</label>
      <input type="text" id="piece-title" name="title" required>
    </div>

    <div>
      <label for="person-name">Who in your life are you reminded of?</label>
      <input type="text" id="person-name" name="person" required>
    </div>

    <div>
      <label for="piece-description" id="description-label">What makes this special about them?</label>
      <textarea id="piece-description" name="description" rows="5" required></textarea>
    </div>

    <button type="submit">Submit</button>
    <p id="submit-status" role="status"></p>
  </form>
  </main>

  <script src="db.js"></script>
  <script src="submit.js"></script>
</body>
</html>
