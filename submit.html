<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add a Piece</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="submit-page">
  <main class="submit-container float-in">
  <h1>add a piece to your collection</h1>

  <form id="submit-form">
    <div>
      <label for="piece-image">Image of what you captured</label>
      <input type="file" id="piece-image" onchange="handleImageUpload()" name="image" accept="image/*" required>
      <img id="display-image" height="500" src=" " alt="user's submitted object" hidden>
    </div>

    <div>
      <label for="piece-title">Title this piece.</label>
      <input type="text" id="piece-title" name="title" required>
    </div>

    <div>
      <label for="piece-date">when did this get collected?</label>
      <!-- Defaults to today; dates after today can't be picked (set in submit.js) -->
      <input type="date" id="piece-date" name="dateCollected" required>
    </div>

    <div>
      <label for="person-name">Who in your life are you reminded of?</label>
      <!-- Name field with a dropdown of saved names and a fill-in preview (Tab fills it in) -->
      <div class="name-field">
        <span class="name-preview" aria-hidden="true"><span id="name-preview-typed" class="name-preview-typed"></span><span id="name-preview-rest"></span></span>
        <input type="text" id="person-name" name="person" required autocomplete="off"
          role="combobox" aria-autocomplete="both" aria-expanded="false" aria-controls="person-options">
        <button type="button" id="person-toggle" class="name-toggle" aria-label="Choose a saved name"
          aria-expanded="false" aria-controls="person-options" tabindex="-1" hidden>&#9662;</button>
        <ul id="person-options" class="name-options" role="listbox" aria-label="Saved names" hidden></ul>
      </div>
    </div>

    <div>
      <label for="piece-description" id="description-label">Why does this remind you of them?</label>
      <textarea id="piece-description" name="description" rows="5" required></textarea>
    </div>

    <button type="submit">Submit</button>
    <p id="submit-status" role="status"></p>
  </form>

  <a href="index.html">Back to the archive</a>
  </main>

  <script src="db.js"></script>
  <script src="submit.js"></script>
</body>
</html>
