<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="archive-page">
  <!-- Sidebar of everyone in the archive; choosing a name shows only their pieces -->
  <button type="button" id="people-toggle" class="people-toggle" aria-controls="people-nav" aria-expanded="false" hidden>Show people</button>
  <nav id="people-nav" class="people-nav" aria-label="People">
    <div class="float-in">
      <h2>People</h2>
      <ul id="people-list" class="people-list"></ul>
    </div>
  </nav>

  <header class="archive-controls float-in">
    <div class="view-toggle" role="group" aria-label="View">
      <button type="button" data-view="grid" aria-pressed="true">Grid</button>
      <button type="button" data-view="carousel" aria-pressed="false">Carousel</button>
      <button type="button" data-view="catalogue" aria-pressed="false">Catalogue</button>
      <button type="button" data-view="floating" aria-pressed="false">Floating</button>
    </div>

    <!-- Order of the pieces (grid and carousel) -->
    <div id="sort-order-control">
      <label for="sort-order">Order by</label>
      <select id="sort-order">
        <option value="newest">Date collected (newest first)</option>
        <option value="oldest">Date collected (oldest first)</option>
        <option value="title">Name of piece (A–Z)</option>
        <option value="person">Person in mind (A–Z)</option>
      </select>
    </div>

    <!-- Order of the books (catalogue) -->
    <div id="catalogue-order-control" hidden>
      <label for="catalogue-order">Order by</label>
      <select id="catalogue-order">
        <option value="az">Name (A–Z)</option>
        <option value="za">Name (Z–A)</option>
      </select>
    </div>
  </header>

  <main>
    <p id="archive-message" class="float-in" hidden></p>
    <p id="filter-status" hidden></p>

    <!-- Grid view: every piece in an equal square -->
    <section id="grid-view" class="float-in">
      <h1>The Archive</h1>
      <ul id="piece-grid" class="piece-grid"></ul>
    </section>

    <!-- Carousel view: one piece at a time, in the same order as the grid -->
    <section id="carousel-view" class="float-in" hidden>
      <h1 id="carousel-title"></h1>
      <h2 id="carousel-person"></h2>

      <div class="carousel">
        <button type="button" id="carousel-prev" aria-label="Previous piece">&larr;</button>
        <div class="carousel-track">
          <!-- Sneak peeks of the pieces before and after; the arrow buttons do the same job -->
          <div class="piece-frame carousel-peek carousel-peek-prev" id="carousel-peek-prev" aria-hidden="true">
            <img alt="">
          </div>
          <div class="piece-frame carousel-frame">
            <img id="carousel-image" alt="">
          </div>
          <div class="piece-frame carousel-peek carousel-peek-next" id="carousel-peek-next" aria-hidden="true">
            <img alt="">
          </div>
        </div>
        <button type="button" id="carousel-next" aria-label="Next piece">&rarr;</button>
      </div>

      <p id="carousel-description" class="carousel-description"></p>
      <p id="carousel-details"></p>
      <button type="button" id="edit-piece">Edit this piece</button>

      <!-- Shown in place of the title, people and description while editing -->
      <form id="edit-form" class="edit-form" hidden>
        <div>
          <label for="edit-title">Title this piece.</label>
          <input type="text" id="edit-title" required>
        </div>
        <div>
          <label for="edit-person">Who in your life are you reminded of?</label>
          <p class="field-hint" id="edit-person-hint">Add as many people as you like: press Enter after each name.</p>
          <div id="edit-people"></div>
        </div>
        <div>
          <label for="edit-description" id="edit-description-label">Why does this remind you of them?</label>
          <textarea id="edit-description" rows="5" required></textarea>
        </div>
        <div class="edit-actions">
          <button type="submit">Save</button>
          <button type="button" id="edit-cancel">Cancel</button>
        </div>
        <p id="edit-status" role="status"></p>
      </form>
    </section>

    <!-- Catalogue view: each person's album as a book spine on a shelf, A-Z -->
    <section id="catalogue-view" class="float-in" hidden>
      <h1>Catalogue</h1>
      <ul id="bookshelf" class="bookshelf"></ul>
    </section>

    <!-- Floating view: pieces scattered at random sizes, joined by lines where they share a person -->
    <section id="floating-view" class="float-in" hidden>
      <h1>Floating</h1>
      <p class="field-hint">Lines join pieces that share a person.</p>
      <div id="floating-field" class="floating-field">
        <svg id="floating-lines" class="floating-lines" aria-hidden="true"></svg>
      </div>
    </section>
  </main>

  <footer class="archive-footer float-in">
    <a href="submit.html">Add a piece</a>
  </footer>

  <script src="db.js"></script>
  <script src="people-field.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
